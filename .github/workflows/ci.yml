name: CI/CD Guardrails

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas rasterio geopandas

    - name: Run Automated Guardrails (Unit & Integration Tests)
      run: |
        echo "🛡️ Running pytest gate suite..."
        pytest tests/ -v
